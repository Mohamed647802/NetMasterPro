name: Build NetMaster Pro APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Generate Gradle Wrapper if absent
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NetMaster-Pro-Debug.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/NetMaster-Pro-Release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NetMaster-Pro-Debug
          path: app/build/outputs/apk/debug/NetMaster-Pro-Debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NetMaster-Pro-Release
          path: app/build/outputs/apk/release/NetMaster-Pro-Release.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: NetMaster-Pro-Debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: NetMaster-Pro-Release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NetMaster-Pro-Debug.apk
            NetMaster-Pro-Release.apk
          name: "NetMaster Pro ${{ github.ref_name }}"
          body: |
            ## NetMaster Pro ${{ github.ref_name }}

            ### تحميل التطبيق / Download
            - 📱 **NetMaster-Pro-Release.apk** — نسخة الإنتاج (الموصى بها)
            - 🔧 **NetMaster-Pro-Debug.apk** — نسخة التطوير

            ### التثبيت / Installation
            Enable "Install from unknown sources" in Android Settings before installing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
